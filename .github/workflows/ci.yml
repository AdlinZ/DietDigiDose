name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w validate:release
      - run: pnpm -w lint:all
      - run: pnpm -w test:all
      - run: pnpm -w build:client
      - run: pnpm -w build:server
      - run: pnpm -w build:admin
      - run: pnpm -w audit:prod
