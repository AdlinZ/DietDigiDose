name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm -w validate:toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w validate:release
      - run: pnpm -w lint:all
      - run: pnpm -w test:all
      - run: pnpm -w build:client
      - run: pnpm -w build:server
      - run: pnpm --dir server db:rehearse -- --owner=GitHub-Actions
      - run: pnpm -w build:admin
      - run: pnpm -w audit:prod
