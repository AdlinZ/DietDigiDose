name: dietdigidose-staging

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file:
      - server.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9090
      DATABASE_PATH: /data/dietdigidose.db
      TRUST_PROXY: "1"
      REQUIRE_HTTPS: "1"
      ENABLE_DEMO_SEED: "0"
      MEDIA_LOCAL_ROOT: /data/media
    volumes:
      - staging_database:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9090/api/v1/health',{headers:{'x-forwarded-proto':'https'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [staging]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set STAGING_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [staging]

networks:
  staging:

volumes:
  staging_database:
  caddy_data:
  caddy_config:
