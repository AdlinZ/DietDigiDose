<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>食光烙记 · 首页</title>
<link rel="icon" href="https://dietdigidose.top/logo.png?v=20260728">
<style>
:root{
  --paper:#f4f1ea; --paper-2:#e8e2d6; --card:#fbf9f4;
  --ink:#333333; --night:#104020; --night-2:#1b4a2b;
  --green:#527334; --leaf:#789050; --sand:#c5b5a5; --tan:#a89883; --taupe:#6f6558;
  --ok:#527334; --warn:#8a7a5c; --danger:#3b3b3b;
  --line:rgba(51,51,51,.14); --muted:rgba(51,51,51,.7);
  --np:#f4f1ea; --nm:rgba(244,241,234,.66); --nl:rgba(244,241,234,.16);
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --r:20px; --shadow:0 16px 40px -18px rgba(51,51,51,.25);
  --side-w:236px; --top-h:64px; --tab-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(720px 420px at 88% -60px,rgba(120,144,80,.14),transparent 65%),
             radial-gradient(560px 380px at -80px 70%,rgba(197,181,165,.2),transparent 60%);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block}
a{color:inherit;text-decoration:none}
::selection{background:rgba(82,115,52,.25)}
*{scrollbar-width:thin;scrollbar-color:var(--tan) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--paper-2)}
::-webkit-scrollbar-thumb{background:var(--tan);border-radius:8px;border:2px solid var(--paper-2)}
::-webkit-scrollbar-thumb:hover{background:var(--green)}
.ic{width:1.1em;height:1.1em;flex:none;display:inline-block;vertical-align:-.18em}
[data-icon]{display:inline-flex;align-items:center;justify-content:center}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:linear-gradient(178deg,var(--night) 0%,var(--night-2) 100%);color:var(--np);display:flex;flex-direction:column;padding:22px 16px 18px;z-index:40}
.side::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px 200px at 110% -40px,rgba(120,144,80,.25),transparent 70%)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;border-bottom:1px solid var(--nl);position:relative;z-index:1}
.brand img{width:40px;height:40px;border-radius:50%;background:var(--np);padding:3px}
.brand b{font-family:var(--serif);font-size:17px;letter-spacing:.06em;display:block;line-height:1.2}
.brand small{color:var(--nm);font-size:10.5px;letter-spacing:.12em}
.snav{display:flex;flex-direction:column;gap:4px;margin-top:16px;position:relative;z-index:1}
.snav button{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:14px;color:var(--nm);font-weight:600;font-size:13.5px;transition:.25s;text-align:left}
.snav button .ic{width:17px;height:17px}
.snav button:hover{color:var(--np);background:rgba(244,241,234,.07)}
.snav button.on{background:var(--np);color:var(--night);font-weight:800;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.snav button .bdg{margin-left:auto;background:rgba(197,181,165,.25);color:var(--sand);border-radius:999px;font-size:10.5px;font-weight:800;padding:1px 8px}
.snav button.on .bdg{background:rgba(16,64,32,.12);color:var(--green)}
.side-quick{margin-top:14px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.sq{display:flex;align-items:center;gap:9px;border:1px solid var(--nl);border-radius:14px;padding:10px 14px;color:var(--np);font-size:12.5px;font-weight:700;transition:.25s}
.sq:hover{border-color:var(--sand);background:rgba(244,241,234,.06)}
.sq.fill{background:var(--sand);border-color:var(--sand);color:var(--night)}
.sq.fill:hover{background:var(--np)}
.sq .bdg{margin-left:auto;background:rgba(16,64,32,.16);border-radius:999px;padding:0 8px;font-size:10.5px;font-weight:800}
.side-foot{margin-top:auto;position:relative;z-index:1;border-top:1px solid var(--nl);padding-top:14px;display:flex;align-items:center;gap:10px}
.side-foot img{width:32px;height:32px;border-radius:50%;background:var(--np);padding:2px}
.side-foot b{font-size:12.5px;display:block;line-height:1.3}
.side-foot small{color:var(--nm);font-size:10px;letter-spacing:.08em}
.main{flex:1;margin-left:var(--side-w);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 26px;background:rgba(244,241,234,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.top.hide{transform:translateY(-100%)}
.search{position:relative;flex:1;max-width:560px}
.search .box{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;transition:.25s}
.search .box:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(82,115,52,.14)}
.search .box .ic{color:var(--green)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px}
.search input::placeholder{color:var(--muted)}
.pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:380px;overflow:auto;display:none;z-index:60}
.pop.open{display:block}
.pop h5{font-size:10.5px;letter-spacing:.18em;color:var(--taupe);padding:10px 16px 4px;font-weight:800}
.pop button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 16px;text-align:left;font-size:13px;transition:.15s}
.pop button:hover{background:rgba(82,115,52,.08)}
.pop button .ic{color:var(--green)}
.pop button small{margin-left:auto;color:var(--muted);font-size:11px;flex:none}
.pop .none{padding:14px 16px;color:var(--muted);font-size:12.5px}
.top-acts{display:flex;align-items:center;gap:10px;margin-left:auto}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:800;color:var(--green);transition:.25s}
.tbtn:hover{border-color:var(--green);transform:translateY(-1px)}
.tbtn.fill{background:var(--night);border-color:var(--night);color:var(--np)}
.tbtn.fill:hover{background:var(--green)}
.tbtn .bdg{position:absolute;top:-7px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:var(--sand);color:var(--night);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--paper)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);padding:3px;transition:.25s}
.avatar:hover{border-color:var(--green);transform:translateY(-1px)}
.avatar img{width:100%;height:100%;border-radius:50%}
.content{padding:24px 26px 60px;max-width:1240px;width:100%;margin:0 auto}
.view{display:none}
.view.on{display:block}
.view.enter .rise{animation:up .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px -6px rgba(51,51,51,.12);position:relative;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .tic{width:30px;height:30px;border-radius:10px;background:rgba(82,115,52,.12);color:var(--green);display:flex;align-items:center;justify-content:center}
.card-h .tic .ic{width:15px;height:15px}
.card-h b{font-size:14.5px;font-weight:800}
.card-h .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.link{color:var(--green);font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;transition:.2s}
.link:hover{gap:7px;color:var(--night)}
.link.warm{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:10.5px;font-weight:800}
.chip.g{background:rgba(82,115,52,.12);color:var(--green)}
.chip.w{background:rgba(138,122,92,.14);color:var(--warn)}
.chip.t{background:rgba(111,101,88,.12);color:var(--taupe)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:9px 18px;font-size:12.5px;font-weight:800;transition:.22s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--night);color:var(--np)}
.btn.fill:hover{background:var(--green)}
.btn.soft{background:rgba(82,115,52,.12);color:var(--green)}
.btn.soft:hover{background:rgba(82,115,52,.2)}
.btn.line{border-color:var(--line);background:var(--card);color:var(--ink)}
.btn.line:hover{border-color:var(--green);color:var(--green)}
.btn.warm{background:rgba(138,122,92,.16);color:var(--warn)}
.btn.warm:hover{background:rgba(138,122,92,.26)}
.btn.sm{padding:6px 13px;font-size:11.5px}
.btn.block{width:100%}
.ibtn{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:.2s;flex:none}
.ibtn:hover{background:rgba(82,115,52,.12);color:var(--green)}
.ibtn.danger:hover{background:rgba(59,59,59,.12);color:var(--danger)}
.ibtn .ic{width:14px;height:14px}
/* smart carousel */
.smart{background:linear-gradient(140deg,rgba(82,115,52,.14),rgba(120,144,80,.08) 55%,rgba(197,181,165,.14));border:1px solid rgba(82,115,52,.25);border-radius:24px;padding:20px;overflow:hidden;touch-action:pan-y}
.smart .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.smart .hd .tic{width:28px;height:28px;border-radius:10px;background:var(--night);color:var(--sand);display:flex;align-items:center;justify-content:center}
.smart .hd b{font-size:14.5px;font-weight:900}
.smart .hd .idx{margin-left:auto;text-align:right}
.smart .hd .idx i{display:block;font-style:normal;font-size:10px;font-weight:800;color:var(--green);letter-spacing:.14em}
.smart .hd .idx small{font-size:10px;color:var(--muted);font-weight:700}
.smart .body{transition:opacity .22s,transform .22s}
.smart .body.out{opacity:0;transform:translateX(-14px)}
.smart .tags{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.smart .tags .kcal{font-size:11px;font-weight:900;color:var(--warn)}
.smart h3{font-family:var(--serif);font-size:20px;font-weight:900;line-height:1.4}
.smart .desc{color:var(--muted);font-size:12.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smart .ft{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:6px;height:6px;border-radius:999px;background:rgba(82,115,52,.25);transition:.25s;cursor:pointer}
.dots i.on{width:18px;background:var(--green)}
.smart .note{display:flex;gap:6px;align-items:flex-start;border-top:1px solid rgba(82,115,52,.16);margin-top:14px;padding-top:10px;color:var(--muted);font-size:10.5px;line-height:1.5}
.smart .note .ic{width:11px;height:11px;margin-top:2px}
/* calorie dashboard */
.cal-top{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring .bg{stroke:rgba(82,115,52,.15)}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ctr b{font-size:17px;font-weight:900;color:var(--green);line-height:1.1}
.ring .ctr small{font-size:9px;color:var(--muted);font-weight:700}
.cal-meta{min-width:0;flex:1}
.cal-meta .lb{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.cal-meta .v{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.cal-meta .v b{font-size:24px;font-weight:900;color:var(--night);font-family:var(--serif)}
.cal-meta .v small{color:var(--muted);font-size:11px}
.cal-panel{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;transition:opacity .2s,transform .2s;cursor:pointer}
.cal-panel.out{opacity:0;transform:translateY(-6px)}
.cal-panel .m{flex:1;text-align:center;min-width:0}
.cal-panel .m + .m{border-left:1px solid var(--line)}
.cal-panel .m small{display:block;font-size:9.5px;color:var(--muted);font-weight:700}
.cal-panel .m b{font-size:13px;font-weight:900}
.cal-panel .m b.g{color:var(--green)}
.cal-dots{display:flex;justify-content:center;gap:5px;margin-top:9px}
.cal-dots i{width:4px;height:4px;border-radius:99px;background:rgba(168,152,131,.5);cursor:pointer;transition:.25s}
.cal-dots i.on{width:14px;background:var(--green)}
.cal-acts{display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.cal-acts .btn{flex:1}
.meals{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.meal{display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:7px 10px;transition:.2s}
.meal:hover{border-color:rgba(82,115,52,.4)}
.meal .slot{flex:none}
.meal .nm{flex:1 1 100%;order:-1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .kc{font-size:11.5px;font-weight:900;color:var(--warn);flex:none}
.meal .tm{font-size:10px;color:var(--muted);flex:none;margin-right:auto}
/* trend */
.trend{margin-top:14px}
.trend svg{width:100%;height:96px;display:block}
.trend .bar{fill:var(--leaf);transform-origin:bottom;transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.trend .bar.today{fill:var(--green)}
.trend .bar.over{fill:var(--tan)}
@keyframes grow{from{transform:scaleY(0)}}
.trend text{font-size:8.5px;fill:var(--muted);font-weight:700}
.trend .tl{stroke:var(--warn);stroke-dasharray:3 4;stroke-width:1}
/* assets */
.shopbar{display:flex;align-items:center;gap:10px;background:rgba(138,122,92,.1);border:1px solid rgba(138,122,92,.3);border-radius:14px;padding:10px 14px;margin-bottom:12px;transition:.2s;width:100%;text-align:left}
.shopbar:hover{background:rgba(138,122,92,.16)}
.shopbar .ic{color:var(--warn)}
.shopbar .tx{flex:1;min-width:0;font-size:12px;color:var(--warn);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.shopbar .tx .it{background:var(--card);border:1px solid rgba(138,122,92,.3);border-radius:999px;padding:1px 9px;font-size:10.5px;color:var(--ink);font-weight:700}
.shopbar .tx .it small{color:var(--muted);font-weight:500;margin-left:3px}
.inv-hl{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px;border:1px solid rgba(82,115,52,.2);background:rgba(82,115,52,.06);transition:opacity .22s,transform .22s;width:100%;text-align:left}
.inv-hl.out{opacity:0;transform:translateY(-8px)}
.inv-hl.amber{border-color:rgba(138,122,92,.35);background:rgba(138,122,92,.1)}
.inv-hl .tic{width:42px;height:42px;border-radius:13px;background:var(--card);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.inv-hl.amber .tic{color:var(--warn);background:rgba(138,122,92,.16)}
.inv-hl .tic .ic{width:19px;height:19px}
.inv-hl .tx{flex:1;min-width:0}
.inv-hl .tx i{font-style:normal;font-size:10px;font-weight:900;color:var(--green);letter-spacing:.1em}
.inv-hl.amber .tx i{color:var(--warn)}
.inv-hl .tx b{display:block;font-size:13.5px;font-weight:900;margin-top:1px}
.inv-hl .tx small{color:var(--muted);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-hl .go{width:30px;height:30px;border-radius:10px;background:var(--night);color:var(--np);display:flex;align-items:center;justify-content:center;flex:none}
.inv-hl.amber .go{background:var(--warn)}
.stores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.store{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px 4px;text-align:center;transition:.2s;cursor:pointer}
.store:hover{border-color:var(--green);transform:translateY(-2px)}
.store b{display:block;font-size:17px;font-weight:900;color:var(--green)}
.store small{font-size:10px;color:var(--muted);font-weight:700}
/* queue */
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-size:12px;font-weight:700;cursor:grab;transition:.2s}
.qchip:hover{border-color:var(--green)}
.qchip.dragging{opacity:.4}
.qchip .grip{color:var(--tan);cursor:grab}
.qchip .k{color:var(--warn);font-size:10.5px;font-weight:800}
.qchip.drop-before{box-shadow:-3px 0 0 var(--green)}
.qchip.drop-after{box-shadow:3px 0 0 var(--green)}
/* community */
.post{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;transition:.2s;width:100%;text-align:left}
.post.out{opacity:0;transform:translateY(-8px)}
.post:hover{border-color:rgba(82,115,52,.4)}
.post .av{width:26px;height:26px;border-radius:50%;background:var(--night);color:var(--sand);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.post .bd{flex:1;min-width:0}
.post .uh{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.post .uh b{font-size:12px}
.post .ct{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post .lk{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;color:var(--muted);font-weight:700}
.post .lk .ic{width:11px;height:11px;color:var(--warn)}
.post .thumb{width:74px;height:74px;border-radius:12px;background:rgba(82,115,52,.12);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.post .thumb .ic{width:26px;height:26px}
/* community: channel bar + xiaohongshu masonry waterfall */
.chan{position:sticky;top:var(--top-h);z-index:20;background:rgba(244,241,234,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px 14px;transition:top .32s cubic-bezier(.2,.7,.2,1)}
body:has(.top.hide) .chan{top:0}
.chan .row{display:flex;align-items:center;gap:8px;height:44px;max-width:1160px;margin:0 auto}
.chan .sbtn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none;transition:.2s;cursor:pointer}
.chan .sbtn.on{background:var(--night);border-color:var(--night);color:var(--np)}
.chan .sbtn .ic{width:15px;height:15px}
.chan .tabs{display:flex;flex:1;min-width:0}
.chan .tabs button{flex:1;position:relative;height:44px;font-size:12.5px;font-weight:800;color:var(--muted);transition:.2s;cursor:pointer}
.chan .tabs button.on{color:var(--night);font-weight:900}
.chan .tabs button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:2px;width:20px;height:3px;border-radius:99px;background:var(--green)}
.chan .cpub{display:none;align-items:center;gap:6px;flex:none;background:var(--night);color:var(--np);border-radius:999px;padding:8px 16px;font-size:11.5px;font-weight:900;cursor:pointer;transition:.2s}
.chan .cpub:hover{background:var(--green)}
.chan .cpub .ic{width:12px;height:12px}

.rcard .cv .time{position:absolute;bottom:8px;right:8px;background:rgba(251,249,244,.92);border-radius:999px;padding:2px 9px;font-size:10px;font-weight:800;color:var(--green);display:flex;gap:4px;align-items:center}
.rcard .bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.rcard .bd b{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .bd .ds{font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .ft{margin-top:auto;padding-top:8px;border-top:1px solid var(--paper-2);display:flex;align-items:center;gap:8px;font-size:11px}
.rcard .ft .kc{color:var(--green);font-weight:900}
.rcard .ft .pr{color:var(--muted)}
.rcard .ft .est{margin-left:auto;color:var(--warn);font-weight:800;font-size:10px}
.more{display:flex;justify-content:center;padding:14px 0 2px}
/* assets view */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.sel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--ink);outline:none;cursor:pointer}
.sel:focus{border-color:var(--green)}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--muted);transition:.2s;cursor:pointer}
.toggle.on{background:rgba(138,122,92,.16);border-color:rgba(138,122,92,.4);color:var(--warn)}
.views{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.vchip{display:inline-flex;align-items:center;gap:6px;background:rgba(82,115,52,.1);border:1px solid rgba(82,115,52,.3);color:var(--green);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800;cursor:pointer;transition:.2s}
.vchip:hover{background:rgba(82,115,52,.18)}
.vchip .x{opacity:.6;font-weight:900}
.vchip .x:hover{opacity:1}
.plist{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:8px 12px;transition:.2s}
.prow:hover{border-color:rgba(82,115,52,.4)}
.prow.sel-on{border-color:var(--green);background:rgba(82,115,52,.07)}
.prow input[type=checkbox]{width:15px;height:15px;accent-color:var(--green);cursor:pointer;flex:none}
.prow .pic{width:30px;height:30px;border-radius:10px;background:rgba(82,115,52,.12);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.prow .pic .ic{width:15px;height:15px}
.prow .nm{flex:1;min-width:0}
.prow .nm b{font-size:12.5px;display:block;line-height:1.3}
.prow .nm small{color:var(--muted);font-size:10.5px}
.prow .exp{flex:none}
.bulk{position:sticky;bottom:12px;z-index:20;display:flex;align-items:center;gap:10px;background:var(--night);color:var(--np);border-radius:16px;padding:10px 16px;margin-top:12px;box-shadow:var(--shadow);animation:up .3s both}
.bulk b{font-size:12px}
.bulk .sp{margin-left:auto;display:flex;gap:8px}
.bulk .btn.soft{background:rgba(244,241,234,.14);color:var(--np)}
.bulk .btn.warm{background:rgba(197,181,165,.2);color:var(--sand)}
.srow{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:8px 12px;transition:.2s;cursor:grab}
.srow:hover{border-color:rgba(138,122,92,.5)}
.srow.dragging{opacity:.4}
.srow.drop-before{box-shadow:0 -3px 0 var(--warn)}
.srow.drop-after{box-shadow:0 3px 0 var(--warn)}
.srow .grip{color:var(--tan)}
.srow .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--tan);display:flex;align-items:center;justify-content:center;color:transparent;transition:.2s;flex:none;cursor:pointer}
.srow.done .ck{background:var(--green);border-color:var(--green);color:var(--np)}
.srow .ck .ic{width:11px;height:11px}
.srow .nm{flex:1;min-width:0;font-size:12.5px;font-weight:700}
.srow.done .nm{text-decoration:line-through;color:var(--muted)}
.srow .nm small{color:var(--muted);font-weight:500;margin-left:6px;font-size:10.5px}
.srow .mv{display:flex;gap:2px}
.addform{display:flex;gap:8px;margin-top:12px}
.addform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:12px;outline:none}
.addform input:focus{border-color:var(--green)}
.addform input.amt{flex:0 0 88px}
/* me / community view */
.profile{display:flex;align-items:center;gap:14px}
.profile img{width:56px;height:56px;border-radius:50%;background:var(--paper);padding:4px;border:1px solid var(--line)}
.profile b{font-size:16px;font-family:var(--serif)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:900;color:var(--green)}
.stat small{font-size:10px;color:var(--muted);font-weight:700}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .lb{flex:1;min-width:0}
.setrow .lb b{font-size:13px;display:block}
.setrow .lb small{color:var(--muted);font-size:11px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;transition:.2s}
.stepper button:hover{border-color:var(--green);color:var(--green)}
.stepper b{min-width:74px;text-align:center;font-size:13px;font-weight:900;color:var(--green)}
.switch{width:42px;height:24px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);position:relative;transition:.25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:0 2px 6px rgba(51,51,51,.25);transition:.25s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on::after{left:20px}
/* drawer / toast / tabbar */
.scrim{position:fixed;inset:0;background:rgba(16,64,32,.4);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:70}
body.drawer-open .scrim{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--card);z-index:80;transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(16,64,32,.25)}
body.drawer-open .drawer{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:15px;font-weight:900;font-family:var(--serif)}
.drawer .dh .x{margin-left:auto}
.drawer .db{padding:20px 22px;overflow-y:auto;flex:1}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.drawer .df .btn{flex:1}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:11px;font-weight:800;color:var(--taupe);letter-spacing:.08em;margin-bottom:6px}
.frow input,.frow select,.frow textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 13px;font-size:13px;outline:none;transition:.2s}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(82,115,52,.12)}
.frow textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ingline{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.ingline:last-child{border-bottom:0}
.ingline .ic{color:var(--leaf)}
.ingline .have{margin-left:auto}
.steps-ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps-ol li{counter-increment:s;position:relative;padding-left:36px;font-size:12.5px;color:var(--muted)}
.steps-ol li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.nutri .n{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.nutri .n b{display:block;font-size:14px;font-weight:900;color:var(--green)}
.nutri .n small{font-size:9.5px;color:var(--muted);font-weight:700}
.planrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.planrow .slot{flex:none}
.planrow .nm{flex:1;min-width:0;font-size:13px;font-weight:800}
.planrow .kc{color:var(--warn);font-weight:900;font-size:12px;flex:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:110;display:flex;align-items:center;gap:12px;background:var(--night);color:var(--np);border:1px solid rgba(197,181,165,.45);padding:11px 20px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 20px 44px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.7,.2,1);max-width:min(92vw,480px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ic{color:var(--sand)}
.toast button{color:var(--sand);font-weight:900;font-size:12px;border-left:1px solid var(--nl);padding-left:12px;flex:none}
.toast button:hover{color:var(--np)}
/* quick-action windows (chat / add-food / post / meal) */
.win{position:fixed;inset:0;z-index:95;background:var(--paper);display:flex;flex-direction:column;transform:translateY(102%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.7,.2,1),visibility 0s .38s}
body.win-open .win{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.win-h{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + 0px);border-bottom:1px solid var(--line);background:rgba(251,249,244,.92);backdrop-filter:blur(12px)}
.win-h .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.win-h .back .ic{width:15px;height:15px}
.win-h b{font-size:15px;font-weight:900;font-family:var(--serif);flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-h .hr{flex:none;display:flex;align-items:center;gap:8px}
.win-b{flex:1;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));scrollbar-width:thin;scrollbar-color:var(--sand) transparent}
.win-b::-webkit-scrollbar{width:8px}
.win-b::-webkit-scrollbar-track{background:transparent}
.win-b::-webkit-scrollbar-thumb{background:var(--sand);border-radius:99px;border:2px solid var(--paper)}
.win-b::-webkit-scrollbar-thumb:hover{background:var(--leaf)}
.win-col{max-width:680px;margin:0 auto;width:100%}
.win-f{flex:none;border-top:1px solid var(--line);background:rgba(251,249,244,.94);backdrop-filter:blur(12px);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.win-f .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.win-sub{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center;margin-top:2px}
.chat-empty{text-align:center;padding:44px 10px 22px}
.chat-empty h3{font-size:19px;font-weight:900;font-family:var(--serif);color:var(--ink)}
.chat-empty p{font-size:12.5px;color:var(--muted);margin-top:6px}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:4px;padding:5px;max-width:calc(100% - 24px);border-radius:999px;background:linear-gradient(120deg,var(--night) 15%,var(--night-2) 95%);border:1px solid rgba(197,181,165,.4);box-shadow:0 14px 34px -14px rgba(16,64,32,.6),0 3px 10px rgba(16,64,32,.22);animation:islandIn .5s cubic-bezier(.2,.7,.2,1) both}
.island .ibtn{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(244,241,234,.1);color:var(--np);display:flex;align-items:center;justify-content:center;flex:none;transition:.18s}
.island .ibtn:hover{background:rgba(244,241,234,.22)}
.island .ibtn:active{transform:scale(.92)}
.island .ibtn .ic{width:15px;height:15px}
.island .who{display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0}
.island .who .dot{width:7px;height:7px;border-radius:50%;background:var(--leaf);flex:none;animation:islePulse 2.4s ease-out infinite}
.island .who b{font-family:var(--serif);font-size:14px;font-weight:900;color:var(--np);letter-spacing:.05em;white-space:nowrap}
.island .who .vdiv{width:1px;height:12px;background:rgba(197,181,165,.45);flex:none}
.island .who i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--sand);white-space:nowrap}
.island .bdg{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:99px;background:var(--sand);color:var(--night);font-size:8.5px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid var(--night)}
#chatScroll{padding-top:74px}
#chatScroll:has(#chatEmpty:not([hidden])) .win-col{min-height:100%;display:flex;flex-direction:column;justify-content:center}
@keyframes islandIn{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.86)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes islePulse{0%{box-shadow:0 0 0 0 rgba(120,144,80,.55)}70%{box-shadow:0 0 0 6px rgba(120,144,80,0)}100%{box-shadow:0 0 0 0 rgba(120,144,80,0)}}
.msgs{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.msg.ai .av{background:var(--night);color:var(--np)}
.msg.ai .av .ic{width:14px;height:14px}
.msg.user{flex-direction:row-reverse}
.msg.user .av{background:var(--sand);color:var(--night)}
.msg .bub{max-width:min(78%,520px);border-radius:16px;padding:10px 14px;font-size:13px;line-height:1.65}
.msg.ai .bub{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;color:var(--ink)}
.msg.user .bub{background:var(--green);color:#fff;border-top-right-radius:4px;font-weight:600}
.msg .ft{font-size:9.5px;color:var(--muted);margin-top:5px;font-weight:700}
.msg .bub .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--sand);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.acard{margin-top:10px;border:1px solid rgba(82,115,52,.25);background:rgba(82,115,52,.06);border-radius:14px;padding:12px}
.acard .ah{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:900;color:var(--night)}
.acard .ah .ic{width:14px;height:14px;color:var(--green)}
.acard .am{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.acard .ar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acard .ar .btn{padding:7px 12px;font-size:11px}
.acard.done{border-color:var(--line);background:var(--paper)}
.scanrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.scanrow:last-of-type{border-bottom:0}
.scanrow input[type=checkbox]{accent-color:var(--green);width:15px;height:15px;flex:none}
.scanrow .si{width:26px;height:26px;border-radius:9px;background:rgba(120,144,80,.16);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.scanrow .si .ic{width:13px;height:13px}
.scanrow input[type=text],.scanrow input[type=number]{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 8px;font-size:11.5px;min-width:0}
.scanrow .sn{flex:1}
.scanrow .sq{width:64px}
.scanrow .sd{width:52px}
.scanrow .conf{font-size:9.5px;font-weight:900;color:var(--leaf);flex:none}
.storepills{display:flex;gap:5px;flex:none}
.storepills button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 8px;font-size:10px;font-weight:800;color:var(--muted)}
.storepills button.on{background:var(--green);border-color:var(--green);color:#fff}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chipbtn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:800;color:var(--green);display:inline-flex;align-items:center;gap:6px}
.chipbtn .ic{width:12px;height:12px}
.chipbtn:hover{border-color:var(--green)}
.composer{border:1px solid var(--line);background:rgba(251,249,244,.8);backdrop-filter:blur(14px);border-radius:20px;padding:10px 12px;box-shadow:0 10px 26px -18px rgba(16,64,32,.4)}
.composer .row{display:flex;align-items:flex-end;gap:9px}
.composer textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:13px;line-height:1.5;max-height:96px;min-height:22px;color:var(--ink);font-family:inherit}
.sendbtn{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:.2s}
.sendbtn .ic{width:15px;height:15px}
.sendbtn:disabled{background:var(--sand);cursor:not-allowed}
.composer .disc{font-size:9.5px;color:var(--muted);font-weight:700;margin-top:8px;text-align:center}
.consent{position:absolute;inset:0;z-index:5;background:rgba(16,64,32,.4);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}
.consent .box{background:var(--card);border-radius:20px;padding:20px;max-width:340px;width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
.consent b{font-size:14px;font-weight:900}
.consent p{font-size:11.5px;color:var(--muted);margin:8px 0 14px;line-height:1.6}
.consent .r{display:flex;gap:10px}
.consent .r .btn{flex:1}
.af-hero{margin-bottom:14px}
.af-hero h3{font-size:17px;font-weight:900;font-family:var(--serif)}
.af-hero p{font-size:11.5px;color:var(--muted);margin-top:4px}
.af-card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;margin-bottom:10px;transition:.2s}
.af-card:hover{border-color:var(--green);transform:translateY(-1px)}
.af-card .tic{width:38px;height:38px;border-radius:13px;background:rgba(82,115,52,.12);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.af-card .tic .ic{width:17px;height:17px}
.af-card b{font-size:13.5px;font-weight:900;display:block}
.af-card small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.55}
.af-link{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--green);margin-top:4px}
.af-link .ic{width:12px;height:12px}
.scanning{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:26px 18px;text-align:center;position:relative;overflow:hidden}
.scanning .frame{width:120px;height:120px;margin:0 auto 14px;border-radius:20px;border:2px dashed var(--leaf);display:flex;align-items:center;justify-content:center;color:var(--leaf);position:relative}
.scanning .frame .ic{width:40px;height:40px}
.scanning .frame::after{content:"";position:absolute;left:8px;right:8px;height:2px;background:var(--green);box-shadow:0 0 12px var(--green);animation:sweep 1.2s ease-in-out infinite}
@keyframes sweep{0%,100%{top:10px}50%{top:104px}}

function eventHTML(list){

function genPlan(){
  const pick=(band,exclude)=>{const pool=RECIPES.filter(r=>r.kcal>=band[0]&&r.kcal<=band[1]&&!exclude.includes(r.id));const r=pool[Math.floor(Math.random()*pool.length)]||RECIPES[0];return r.id;};
  const b=pick([150,420],[]);const l=pick([300,700],[b]);const d=pick([140,560],[b,l]);
  S.plan=[b,l,d];
}

  if(a==='recipe'){openDrawer({type:'recipe',id});return;}
  if(a==='queue-open'){openDrawer({type:'queue'});return;}
  if(a==='queue-add'){if(!S.queue.includes(+id)){S.queue.push(+id);render();toast('已加入烹饪队列');}else toast('已在队列中');return;}
  if(a==='queue-rm'){destructive(()=>{S.queue=S.queue.filter(q=>q!==+id);},'已移出队列');return;}
  if(a==='queue-clear'){destructive(()=>{S.queue=[];},'队列已清空');return;}
  if(a==='cook'){const r=recipe(id);S.queue=S.queue.filter(q=>q!==+id);render();openWin({type:'meal',prefill:r.title,kcal:r.kcal,p:r.p,c:r.c,f:r.f});return;}
  if(a==='chat-open'){openWin({type:'chat'});return;}
  if(a==='plan-open'){openDrawer({type:'plan'});return;}
  if(a==='plan-regen'){genPlan();renderDrawer();return;}
  if(a==='plan-reroll'){const ex=S.plan.filter((_,j)=>j!==i);const band=[[150,420],[300,700],[140,560]][i];const pool=RECIPES.filter(r=>r.kcal>=band[0]&&r.kcal<=band[1]&&!ex.includes(r.id));S.plan[i]=(pool[Math.floor(Math.random()*pool.length)]||RECIPES[0]).id;renderDrawer();return;}
  if(a==='plan-apply'){S.plan.forEach(id=>{if(!S.queue.includes(id))S.queue.push(id);});render();toast('三餐已加入烹饪队列');closeDrawer();return;}
  if(a==='cat'){S.cat=v;S.shown=3;render();return;}
  if(a==='more'){S.shown+=3;render();return;}
  if(a==='ing-new'||a==='addfood-open'){openWin({type:'addfood',mode:'choose'});return;}
  if(a==='recipe-new'){openDrawer({type:'recipeNew'});return;}
  if(a==='ing-edit'){openWin({type:'addfood',mode:'manual',id});return;}
  if(a==='ing-del'){destructive(()=>{S.pantry=S.pantry.filter(p=>p.id!==id);},'已删除食材');return;}
  if(a==='p-filter'){S.pFilter=v;render();return;}
  if(a==='p-exp'){S.pExp=!S.pExp;render();return;}
  if(a==='bulk-cancel'){S.pSel=[];render();return;}
  if(a==='bulk-shop'){const items=S.pantry.filter(p=>S.pSel.includes(p.id));items.forEach(p=>{if(!S.shop.some(s=>s.name===p.name))S.shop.push({id:uid('s'),name:p.name,amount:p.qty,checked:false});});S.pSel=[];render();toast(`已将 ${items.length} 项加入采购单`);return;}
  if(a==='bulk-del'){const n=S.pSel.length;destructive(()=>{S.pantry=S.pantry.filter(p=>!S.pSel.includes(p.id));},`已删除 ${n} 项食材`);return;}
  if(a==='view-apply'){if(e.target.closest('.x'))return;const vw=S.views[i];S.pFilter=vw.filter;S.pExp=vw.exp;S.pSort=vw.sort;render();toast(`已应用视图「${vw.name}」`);return;}
  if(a==='view-del'){S.views.splice(i,1);saveViews();render();return;}
  if(a==='view-save-open'){$('#viewFormSlot').innerHTML=`<form class="addform" id="viewForm" style="margin:0 0 12px"><input name="name" placeholder="视图名称，如：周末备餐" required maxlength="12"><button class="btn fill sm" type="submit">保存</button></form>`;$('#viewForm input').focus();return;}
  if(a==='s-filter'){S.sFilter=v;render();return;}
  if(a==='shop-toggle'){const it=S.shop.find(s=>s.id===id);it.checked=!it.checked;render();return;}
  if(a==='shop-del'){destructive(()=>{S.shop=S.shop.filter(s=>s.id!==id);},'已删除采购项');return;}
  if(a==='shop-up'||a==='shop-down'){const idx=S.shop.findIndex(s=>s.id===id);const j=idx+(a==='shop-up'?-1:1);if(j<0||j>=S.shop.length)return;[S.shop[idx],S.shop[j]]=[S.shop[j],S.shop[idx]];render();return;}
  if(a==='shop-stock'){const done=S.shop.filter(s=>s.checked);done.forEach(s=>{if(!S.pantry.some(p=>p.name===s.name))S.pantry.unshift({id:uid('p'),name:s.name,qty:s.amount||'1 份',store:'位置待确认',days:5,icon:'leaf'});});S.shop=S.shop.filter(s=>!s.checked);render();toast(`已入库 ${done.length} 项，存放方式待确认`);return;}
  if(a==='like'){const p=S.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;patchCommBody();if(W&&W.type==='pd'&&W.id===id){const i=$('#pdInput');if(i)W.pdDraft=i.value;renderWin();}return;}
  if(a==='post-open'){openWin({type:'post',topic:'寻味'});return;}
  if(a==='share-day'){const names=S.meals.map(m=>m.name).join('、')||'今天还没记录';openWin({type:'post',topic:'寻味',body:`今天吃了：${names}。已知热量 ${consumed()} kcal，饮水 ${S.water} ml。好好吃饭，慢慢记录。`});return;}
  if(a==='c-tab'){S.cTab=v;S.cShown=12;render();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});return;}
  if(a==='c-search'){S.cSearch=!S.cSearch;if(!S.cSearch)S.cQuery='';render();return;}
  if(a==='cq-clear'){S.cQuery='';patchCommBody();const i=$('#cq');if(i){i.value='';i.focus();}const c=$('#cqClear');if(c)c.hidden=true;return;}
  if(a==='c-act'){S.cAct=v;patchCommBody();return;}
  if(a==='c-q'){S.cQ=v;patchCommBody();return;}
  if(a==='c-more'){S.cShown+=12;patchCommBody();return;}
  if(a==='c-reload'){S.cQuery='';S.cShown=12;render();toast('社区内容已刷新');return;}
  if(a==='compose-cat'){openWin({type:'post',topic:v});return;}
  if(a==='pd-open'){openWin({type:'pd',id});return;}
  if(a==='pd-comment'){const i=$('#pdInput');if(i){i.focus();i.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});}return;}
  if(a==='pd-share'){const link=`https://dietdigidose.top/post/${W.id}`;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(()=>toast('动态链接已复制')).catch(()=>toast('动态链接：'+link));}else toast('动态链接：'+link);return;}
  if(a==='pd-send'){const i=$('#pdInput');const txt=(i&&i.value||'').trim();if(!txt){toast('先写点评论吧');return;}const p=S.posts.find(x=>x.id===W.id);p.cl=p.cl||[];p.cl.push({user:'食光内测用户',text:txt,time:'刚刚'});p.comments=p.cl.length;W.pdDraft='';renderWin();patchCommBody();return;}
  if(a==='join'){const p=S.posts.find(x=>x.id===id);if(!p||evStatus(p)==='ended')return;p.joined=!p.joined;p.participants=Math.max(0,(p.participants||0)+(p.joined?1:-1));patchCommBody();toast(p.joined?'已参加活动':'已退出活动');return;}
  if(a==='tgt-minus'){S.target=Math.max(1200,S.target-50);render();return;}
  if(a==='tgt-plus'){S.target=Math.min(3000,S.target+50);render();return;}
  if(a==='remind'){S.remind=!S.remind;render();return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('slot-select')){const f=t.closest('form');if(f){const d=f.querySelector('.slot-display');if(d)d.value=t.value;f.querySelectorAll('.slotchips button').forEach(b=>b.classList.toggle('on',b.dataset.v===t.value));}return;}
  const c=t.dataset.c;if(!c)return;
  if(c==='pSort'){S.pSort=t.value;render();}
  if(c==='rSort'){S.rSort=t.value;render();}
  if(c==='threshold'){S.threshold=+t.value;render();}
  if(c==='p-select'){const id=t.dataset.id;S.pSel=t.checked?[...S.pSel,id]:S.pSel.filter(x=>x!==id);render();}
  if(W&&c==='af-name'){W.rows[+t.dataset.i].name=t.value;}
  if(W&&c==='af-qty'){W.rows[+t.dataset.i].qty=t.value;}
  if(W&&c==='af-days'){W.rows[+t.dataset.i].days=t.value===''?'':Math.max(0,+t.value);}
  if(W&&c==='post-evstart'){W.evStart=t.value;}
  if(W&&c==='post-evend'){W.evEnd=t.value;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cq'){S.cQuery=t.value;patchCommBody();const c=$('#cqClear');if(c)c.hidden=!t.value;return;}
  if(!W)return;
  if(t.id==='pdInput'){W.pdDraft=t.value;return;}
  if(t.id==='chatInput'){W.draft=t.value;syncSend();return;}
  if(t.id==='afText'){W.text=t.value;return;}
  if(t.id==='postTitle'||t.id==='postBody'){if(t.id==='postTitle')W.title=t.value;else W.body=t.value;const n=$('#postCount');if(n)n.textContent=`${(W.imgs||[]).length}/9 · ${(W.title||'').length+(W.body||'').length} 字`;return;}
  if(t.id==='postSearch'){W.search=t.value;const r=$('#rpickRows');if(r)r.innerHTML=rpickRowsHTML();return;}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;const fd=new FormData(f);const fid=f.getAttribute('id');
  if(fid==='mealForm'){const id=fd.get('id');const kcal=fd.get('kcal')===''?null:+fd.get('kcal');
    const rec={id:id||uid('m'),slot:fd.get('slot'),name:String(fd.get('name')).trim(),amount:String(fd.get('amount')||'').trim(),kcal,p:+fd.get('p')||0,c:+fd.get('c')||0,f:+fd.get('f')||0,time:fd.get('time')||'12:00'};
    if(id){S.meals=S.meals.map(m=>m.id===id?rec:m);}else S.meals.unshift(rec);
    closeWin();closeDrawer();render();return;}
  if(fid==='ingForm'){const id=fd.get('id');const name=String(fd.get('name')).trim();
    const rec={id:id||uid('p'),name,qty:String(fd.get('qty')).trim()||'1 份',store:fd.get('store'),days:Math.max(0,+fd.get('days')||0),icon:iconFor(name)};
    if(id)S.pantry=S.pantry.map(p=>p.id===id?rec:p);else S.pantry.unshift(rec);
    closeWin();closeDrawer();render();toast(id?'食材已更新':'已录入保鲜库');return;}
  if(fid==='recipeForm'){const title=String(fd.get('title')).trim();if(!title)return;
    const ing=String(fd.get('ing')).split(/[、，,]/).map(s=>s.trim()).filter(Boolean);
    const steps=String(fd.get('steps')).split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const id=Math.max(0,...RECIPES.map(r=>r.id))+1;
    RECIPES.unshift({id,title,cat:fd.get('cat'),kcal:+fd.get('kcal')||0,p:+fd.get('p')||0,c:+fd.get('c')||0,f:+fd.get('f')||0,time:+fd.get('time')||15,est:false,icon:'book',desc:'我的自定义食谱',ing:ing.length?ing:[title],steps:steps.length?steps:['按自己的习惯做就好。']});
    S.view='recipes';S.cat='全部';S.shown=3;closeDrawer();render();toast('食谱已保存');return;}
  if(fid==='shopForm'){const name=String(fd.get('name')).trim();if(!name)return;S.shop.push({id:uid('s'),name,amount:String(fd.get('amount')).trim()||'1 份',checked:false});render();toast('已加入采购单');return;}
  if(fid==='viewForm'){const name=String(fd.get('name')).trim();if(!name)return;S.views.push({name,filter:S.pFilter,exp:S.pExp,sort:S.pSort});saveViews();render();toast(`视图「${name}」已保存`);return;}
});
/* search */
const q=$('#q'),pop=$('#pop');
q.addEventListener('input',()=>{
  const s=q.value.trim();if(!s){pop.classList.remove('open');pop.innerHTML='';return;}
  const hit=(n)=>n.toLowerCase().includes(s.toLowerCase());
  const rs=RECIPES.filter(r=>hit(r.title)||hit(r.desc)).slice(0,4);
  const ps=S.pantry.filter(p=>hit(p.name)).slice(0,4);
  const ss=S.shop.filter(x=>hit(x.name)).slice(0,3);
  const cs=S.posts.filter(p=>hit(p.content)||hit(p.user)).slice(0,3);
  pop.innerHTML=(rs.length?`<h5>菜谱</h5>`+rs.map(r=>`<button data-a="recipe" data-id="${r.id}">${icon('book')} ${esc(r.title)}<small class="num">${r.kcal} kcal</small></button>`).join(''):'')
   +(ps.length?`<h5>食材</h5>`+ps.map(p=>`<button data-a="ing-edit" data-id="${p.id}">${icon(p.icon)} ${esc(p.name)}<small>${esc(p.store)} · ${p.days} 天</small></button>`).join(''):'')
   +(ss.length?`<h5>采购</h5>`+ss.map(x=>`<button data-a="nav" data-v="assets">${icon('cart')} ${esc(x.name)}<small>${x.checked?'已买':'待买'}</small></button>`).join(''):'')
   +(cs.length?`<h5>动态</h5>`+cs.map(p=>`<button data-a="nav" data-v="community">${icon('users')} ${esc(p.user)}<small>${p.likes} 赞</small></button>`).join(''):'')
   ||`<p class="none">没有找到「${esc(s)}」相关内容</p>`;
  pop.classList.add('open');
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=pop.querySelector('button');if(b)b.click();}if(e.key==='Escape')pop.classList.remove('open');});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))pop.classList.remove('open');});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(W&&(W.consent||W.menu)){W.consent=false;W.menu=false;W.pending=null;renderWin();}else if(W)closeWin();else closeDrawer();pop.classList.remove('open');return;}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatInput'){e.preventDefault();chatSend();}
});
/* drag reorder */
let dragId=null,dragList=null,pending=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el)return;dragId=el.dataset.drag;dragList=el.closest('[data-sortlist]').dataset.sortlist;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId);}catch(x){}el.classList.add('dragging');});
document.addEventListener('dragover',e=>{const el=e.target.closest('[data-drag]');if(!el||!dragId||el.dataset.drag===dragId)return;const list=el.closest('[data-sortlist]');if(!list||list.dataset.sortlist!==dragList)return;e.preventDefault();const r=el.getBoundingClientRect();const after=list.dataset.dir==='x'?e.clientX>r.left+r.width/2:e.clientY>r.top+r.height/2;document.querySelectorAll('.drop-before,.drop-after').forEach(n=>n.classList.remove('drop-before','drop-after'));el.classList.add(after?'drop-after':'drop-before');pending={target:el.dataset.drag,after};});
document.addEventListener('drop',e=>{e.preventDefault();if(!dragId||!pending)return;
  const arr=dragList==='shop'?S.shop:S.queue;const get=x=>dragList==='shop'?x.id:String(x);
  const from=arr.findIndex(x=>get(x)===dragId);if(from<0)return;const [item]=arr.splice(from,1);
  let ti=arr.findIndex(x=>get(x)===pending.target);if(ti<0)ti=arr.length;else if(pending.after)ti++;
  arr.splice(ti,0,item);render();});
document.addEventListener('dragend',()=>{dragId=null;pending=null;document.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(n=>n.classList.remove('dragging','drop-before','drop-after'));});
/* live patches (timers) */
let lastTouch=0;
function syncDots(act,idx){document.querySelectorAll(`[data-a="${act}"]`).forEach((d,i)=>d.classList.toggle('on',i===idx));}
function patchSmart(){const el=$('#smart');if(el)el.innerHTML=smartHTML();}
function patchCal(){const el=$('#calPanel');if(!el)return;el.classList.add('out');setTimeout(()=>{el.innerHTML=calPanels()[S.calPanel];el.classList.remove('out');syncDots('cal-dot',S.calPanel);},reduced?0:180);}
function patchInv(){const el=$('#invHl');if(!el)return;el.classList.add('out');setTimeout(()=>{el.outerHTML=invHlHTML();syncDots('inv-dot',S.invIdx);},reduced?0:180);}
function patchPost(){const el=$('#postHl');if(!el)return;el.classList.add('out');setTimeout(()=>{el.outerHTML=postHlHTML();syncDots('post-dot',S.postIdx);},reduced?0:180);}
setInterval(()=>{if(reduced||document.hidden||S.view!=='home'||Date.now()-lastTouch<3200)return;const n=smartCards().length;if(n<2)return;S.recIdx=(S.recIdx+1)%n;const b=$('#smartBody');if(b){b.classList.add('out');setTimeout(patchSmart,180);}else patchSmart();},4500);
setInterval(()=>{if(reduced||document.hidden||S.view!=='home')return;S.calPanel=(S.calPanel+1)%3;patchCal();},3800);
setInterval(()=>{if(reduced||document.hidden||S.view!=='home')return;const n=invHighlights().length;if(n<2)return;S.invIdx=(S.invIdx+1)%n;patchInv();},4200);
setInterval(()=>{if(reduced||document.hidden||S.view!=='home')return;const n=homeFeed().length;if(n<2)return;S.postIdx=(S.postIdx+1)%n;patchPost();},5000);
document.addEventListener('pointerdown',e=>{if(e.target.closest('.smart,.inv-hl,.post,.cal-panel'))lastTouch=Date.now();});
/* swipe on smart card */
let sx=null;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#smart'))sx=e.clientX;});
document.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)<40)return;lastTouch=Date.now();const n=smartCards().length;S.recIdx=(S.recIdx+(dx<0?1:-1)+n)%n;patchSmart();});
/* scroll: smart header (top bar and summary capsule are mutually exclusive) + infinite recipes */
let lastY=window.scrollY,headHidden=false;
function setHead(hidden){if(hidden===headHidden)return;headHidden=hidden;$('.top').classList.toggle('hide',hidden);$('#capsule').classList.toggle('show',hidden);}
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  if(matchMedia('(max-width:1023px)').matches){
    if(y<=70)setHead(false);
    else if(y>lastY+4)setHead(true);
    else if(y<lastY-4)setHead(false);
  }else setHead(false);
  lastY=y;
  if(S.view==='home'||S.view==='recipes'){const near=document.documentElement.scrollHeight-window.innerHeight-window.scrollY<280;if(near&&S.shown<ranked().length){S.shown+=3;render();}}
  if(S.view==='community'&&S.cTab==='寻味'){const near=document.documentElement.scrollHeight-window.innerHeight-window.scrollY<280;if(near&&S.cShown<cFiltered().length){S.cShown+=12;patchCommBody();}}
},{passive:true});
window.addEventListener('resize',()=>{if(S.view==='community'&&S.cTab==='寻味'&&colCount()!==mCols)patchCommBody();});
buildDock();
render();
initDockHint();
setHead(matchMedia('(max-width:1023px)').matches&&window.scrollY>70);lastY=window.scrollY;
$('#v-home').classList.add('enter');setTimeout(()=>$('#v-home').classList.remove('enter'),800);
</script>
</body>
</html>
